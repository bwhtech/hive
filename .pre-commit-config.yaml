exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "bwh_hive.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # The mirror's tag pins Prettier 2; the frontend pins 3.3.3 in its own
        # package.json. Both must agree or every commit reformats the last one.
        additional_dependencies: ["prettier@3.3.3"]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                bwh_hive/public/dist/.*|
                bwh_hive/public/frontend/.*|
                .*node_modules.*|
                .*boilerplate.*|
                bwh_hive/templates/includes/.*|
                bwh_hive/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                bwh_hive/public/dist/.*|
                bwh_hive/public/frontend/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                bwh_hive/templates/includes/.*|
                bwh_hive/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
